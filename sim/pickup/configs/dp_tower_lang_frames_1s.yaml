# dp_vit_lang_frames_1s.yaml with a frozen pretrained image encoder in place of the ViT trained from scratch: the vision
# tower of Qwen3-VL-2B (the tower the Qwen policies look through; 407M parameters, never trained here), read before its
# merger, one token per 16-pixel patch as the ViT gives, projected to the action head's width
# (vla_foundry/models/vision_language_backbones/frozen_tower.py). Everything else is the 1 s memory recipe: the
# instruction's learned token embeddings, the action head, the frames 1 s apart, the running average of the weights.
# The question: does a policy that cannot learn the look of its demonstrations lose less when the look changes
# (lighting, camera pose, bench)? The tower is loaded from the local model cache; a checkpoint holds only what is trained.
save_path: experiments/pickup
wandb: false
db_logging: false
# A running average of the weights is saved next to the trained ones (ema_N.pt) and evaluated with
# them. While a policy is starting to work the average is far ahead of the trained weights
# (tutorial/notes.md, "Averaged weights and the sampler's settings").
ema:
  enabled: true

model:
  <<: !include ../../../vla_foundry/config_presets/models/diffusion_policy.yaml
  vision_language_backbone:
    type: vit_backbone
    img_size: 224
    patch_size: 16
    hidden_dim: 256
    inter_dim: 1024
    n_heads: 4
    n_layers: 6
    text_tokens: 32
    text_vocab_size: 49280
    frozen_tower: Qwen/Qwen3-VL-2B-Thinking
  transformer:
    type: transformer
    hidden_dim: 256
    n_heads: 4
    n_layers: 6
    max_seq_len: 2048
    is_causal: false

data:
  <<: !include ../../../vla_foundry/config_presets/data/diffusion_policy.yaml
  processor: simple_vlm
  processor_kwargs: {}
  image_size: 224
  img_num_tokens: 1
  seq_len: 64
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - front
    - wrist
  image_indices:
    - -20
    - 0
  lowdim_past_timesteps: 0
  action_fields:
    - action
  proprioception_fields:
    - state
  language_instruction_types:
    - original
  num_workers: 8
  prefetch_factor: 4

distributed:
  fsdp: false

hparams:
  <<: !include ../../../vla_foundry/config_presets/hparams/diffusion_policy.yaml
  per_gpu_batch_size: 64
  global_batch_size: 64
