# vla_custom_tokens.yaml without history: one frame per camera and the current joint state, and the
# policy is not given its previous action (image_indices: [0], lowdim_past_timesteps: 0). Same change
# as dp_vit_lang_reactive.yaml makes to dp_vit_lang.yaml, for the same reason: with the previous
# action as an input, only the first window of each demonstration needs the image or the instruction.
# Pass the VLM with --model.vision_language_backbone.resume_from_checkpoint <.../checkpoint_N.pt>.
save_path: experiments/pickup
wandb: false
db_logging: false

model:
  type: diffusion_policy
  vision_language_backbone:
    type: vlm_foundry_backbone
    num_vlm_layers_to_use: 4
    conditioning: all_tokens
    # 3 prompt tokens + 2 images x 256 + the instruction (<= 8 tokens here); fixed so that the
    # sequence the action head sees has the same length in training batches and when served.
    conditioning_len: 528
  transformer:
    type: transformer
    hidden_dim: 256
    n_heads: 4
    n_layers: 6
    max_seq_len: 2048
    is_causal: false
  noise_scheduler:
    num_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    clamp_range: [-3, 3]
  use_flow_matching_scheduler: true

data:
  <<: !include ../../../vla_foundry/config_presets/data/vla_diffusion.yaml
  processor: simple_vlm
  processor_kwargs: {}
  image_size: 224
  img_num_tokens: 256
  # 2 images x 256 tokens + the instruction; inputs are padded to this length.
  seq_len: 576
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - front
    - wrist
  image_indices:
    - 0
  lowdim_past_timesteps: 0
  action_fields:
    - action
  proprioception_fields:
    - state
  language_instruction_types:
    - original
  num_workers: 8
  prefetch_factor: 2

distributed:
  fsdp: false

hparams:
  <<: !include ../../../vla_foundry/config_presets/hparams/diffusion_policy.yaml
  lr: 3e-4
  per_gpu_batch_size: 32
  global_batch_size: 32
