# dp_vit_lang_frames_1s.yaml with the paired consistency loss: trained on twins (sim/pickup/twins.py), every frame of
# a re-rendered demonstration together with the same frame in the plain look. Both are denoised from the same noise at
# the same flow time; the loss is the flow-matching loss of each (averaged) plus twin_consistency_weight times the mean
# squared difference of their predicted velocities, so that what does not matter to the action cannot change it. The
# twin's images (front_twin, wrist_twin) are read in training only; a served policy is given its own.
# Needs a twins dataset preprocessed with the four cameras (scripts/preprocess.sh with PICKUP_CAMERAS).
save_path: experiments/pickup
wandb: false
db_logging: false
# A running average of the weights is saved next to the trained ones (ema_N.pt) and evaluated with
# them. While a policy is starting to work the average is far ahead of the trained weights
# (tutorial/notes.md, "Averaged weights and the sampler's settings").
ema:
  enabled: true

model:
  <<: !include ../../../vla_foundry/config_presets/models/diffusion_policy.yaml
  # 0.1 and 1 against ~0, 384k samples each: 1 cut the twins' difference tenfold (0.0011 against 0.0105) at the same
  # flow loss (0.292 against 0.295); 0.1 by less than half (0.0061)
  twin_consistency_weight: 1.0
  vision_language_backbone:
    type: vit_backbone
    img_size: 224
    patch_size: 16
    hidden_dim: 256
    inter_dim: 1024
    n_heads: 4
    n_layers: 6
    text_tokens: 32
    text_vocab_size: 49280
  transformer:
    type: transformer
    hidden_dim: 256
    n_heads: 4
    n_layers: 6
    max_seq_len: 2048
    is_causal: false

data:
  <<: !include ../../../vla_foundry/config_presets/data/diffusion_policy.yaml
  processor: simple_vlm
  twin_suffix: _twin
  processor_kwargs: {}
  image_size: 224
  img_num_tokens: 1
  seq_len: 64
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - front
    - wrist
  image_indices:
    - -20
    - 0
  lowdim_past_timesteps: 0
  action_fields:
    - action
  proprioception_fields:
    - state
  language_instruction_types:
    - original
  num_workers: 8
  prefetch_factor: 4

distributed:
  fsdp: false

hparams:
  <<: !include ../../../vla_foundry/config_presets/hparams/diffusion_policy.yaml
  per_gpu_batch_size: 64
  global_batch_size: 64
