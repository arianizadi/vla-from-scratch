# The fast level of a two-level reasoning policy (tutorial/reasoning-vla.md): dp_vit_lang_reactive.yaml reading the
# sub-goal of the expert's notes ("cut the middle shoot", "show the label", "stop") instead of the instruction. The
# sub-goal is a per-frame instruction (language instruction type "subgoal", from the column instruction_subgoal that
# collect.py writes for reasoning tasks). When served, the sub-goal comes from a reasoner (qwen_reasoner.yaml) or, to
# measure this level alone, from the correct notes (eval.py --subgoals expert).
save_path: experiments/pickup
wandb: false
db_logging: false
# A running average of the weights is saved next to the trained ones (ema_N.pt) and evaluated with
# them. While a policy is starting to work the average is far ahead of the trained weights
# (tutorial/notes.md, "Averaged weights and the sampler's settings").
ema:
  enabled: true

model:
  <<: !include ../../../vla_foundry/config_presets/models/diffusion_policy.yaml
  vision_language_backbone:
    type: vit_backbone
    img_size: 224
    patch_size: 16
    hidden_dim: 256
    inter_dim: 1024
    n_heads: 4
    n_layers: 6
    text_tokens: 32
    text_vocab_size: 49280
  transformer:
    type: transformer
    hidden_dim: 256
    n_heads: 4
    n_layers: 6
    max_seq_len: 2048
    is_causal: false

data:
  <<: !include ../../../vla_foundry/config_presets/data/diffusion_policy.yaml
  processor: simple_vlm
  processor_kwargs: {}
  image_size: 224
  img_num_tokens: 1
  seq_len: 64
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - front
    - wrist
  image_indices:
    - 0
  lowdim_past_timesteps: 0
  action_fields:
    - action
  proprioception_fields:
    - state
  language_instruction_types:
    - subgoal
  num_workers: 8
  prefetch_factor: 4

distributed:
  fsdp: false

hparams:
  <<: !include ../../../vla_foundry/config_presets/hparams/diffusion_policy.yaml
  per_gpu_batch_size: 64
  global_batch_size: 64
