# Windowing for the pickup sim: 1 past + current + 14 future low-dim steps (16 total) at 20 Hz,
# two images per camera (t-1, t). The sim renders 224x224 directly and stores JPEG bytes inline, so no
# resize happens here (the LeRobot converter cannot resize already-encoded images).
past_lowdim_steps: 1
future_lowdim_steps: 14
image_indices:
- -1
- 0
stride: 1
max_padding_left: 1
max_padding_right: 14
padding_strategy: copy
filter_still_samples: False
jpeg_quality: 95
max_episodes_to_process: -1
fail_on_nan: True
skip_git_tagging: True
auto_tag: False
resize_images_size: null
