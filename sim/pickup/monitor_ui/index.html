<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Training monitor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131b21'/%3E%3Cg fill='none' stroke='%23e8edf0' stroke-width='2'%3E%3Ccircle cx='16' cy='16' r='10'/%3E%3Ccircle cx='16' cy='16' r='4.5'/%3E%3C/g%3E%3Ccircle cx='20.5' cy='12.5' r='3' fill='%232fb457'/%3E%3C/svg%3E"
    />
    <script>
      // Dark unless the reader chose light; set before the first paint so the page never flashes.
      (function () {
        try {
          var theme = window.localStorage.getItem("monitor.theme");
          if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the runs</a>
    <header class="top">
      <a class="brand" href="#/" aria-label="Training monitor: all runs">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9.5" />
          <circle cx="12" cy="12" r="4.5" />
          <path d="M12 0.5v4M12 19.5v4M0.5 12h4M19.5 12h4" />
          <circle class="brand-hit" cx="15.4" cy="9.2" r="2.3" />
        </svg>
        <span class="brand-name">Training monitor</span>
      </a>
      <nav class="nav" aria-label="Views">
        <a href="#/" data-view="overview">Runs</a>
        <a href="#/compare" data-view="compare">Compare</a>
      </nav>
      <div class="counts" id="counts" role="group" aria-label="Runs by state"></div>
      <div class="conn" id="conn" role="status" data-state="connecting">
        <span class="conn-dot" aria-hidden="true"></span>
        <span class="conn-text">Connecting</span>
        <span class="conn-time"></span>
      </div>
      <button class="icon-button" id="theme" type="button" aria-label="Switch to the light theme"></button>
    </header>
    <div class="banner" id="banner" role="alert" hidden></div>
    <main id="main" tabindex="-1">
      <noscript
        ><p class="empty">
          This monitor draws its charts with JavaScript. Enable it for this page, or use the terminal dashboard: python
          -m sim.pickup.monitor
        </p></noscript
      >
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
